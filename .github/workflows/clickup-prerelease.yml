name: ClickUp pre-release

# Publishes `@time-loop/rolldown` to GitHub Packages from every push to a `clickup/*` branch,
# with the native bindings for every desktop and server platform upstream releases (macOS,
# Windows and glibc/musl Linux, x64 and arm64) inside the package.
#
# A release branch is named after the upstream release it stacks the ClickUp commits on:
# `clickup/v1.2.15` holds upstream `v1.2.15` plus the fork's commits and publishes
# `1.2.15-clickup.N`, N counting the releases made from that branch from 0, under the dist-tags
# `v1.2.15` and `latest`. Every upstream release gets a new branch: rebase the fork's commits onto
# the new tag, name the branch after it, and N starts again at 0. A branch whose package.json
# version is not the release in its name fails the publish.
#
# Any other `clickup/*` branch publishes `<upstream>-clickup.<branch>.<run number>` under the
# branch name as its dist-tag, so an experiment's latest build installs as
# `@time-loop/rolldown@<branch>`. See .github/scripts/clickup-release-version.cjs.
on:
  push:
    branches: ['clickup/**']

permissions: {}

concurrency:
  group: clickup-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # The flags follow upstream's `reusable-release-build.yml`.
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            args: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            args: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: '--use-napi-cross'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            args: '--use-napi-cross'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            args: '-x'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            args: '-x'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Read the pinned Rust toolchain
        id: rust
        shell: bash
        run: echo "version=$(grep 'channel' rust-toolchain.toml | head -1 | awk -F '"' '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # musl targets cross-compile with cargo-zigbuild (`-x`).
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.target, 'musl') }}
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.target, 'musl') }}
        with:
          tool: cargo-zigbuild
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build binding
        shell: bash
        run: pnpm --filter rolldown run build-binding:release --target ${{ matrix.target }} ${{ matrix.args }}
        env:
          TARGET_CC: clang # for mimalloc
      - uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.target }}
          path: packages/rolldown/src/*.node
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@time-loop'
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          path: packages/rolldown/src
          merge-multiple: true
      - name: Build JavaScript
        run: pnpm --filter rolldown run build-node
      - name: Check every binding is in the package
        working-directory: packages/rolldown/dist
        run: >-
          ls -la
          rolldown-binding.darwin-arm64.node rolldown-binding.darwin-x64.node
          rolldown-binding.win32-x64-msvc.node rolldown-binding.win32-arm64-msvc.node
          rolldown-binding.linux-x64-gnu.node rolldown-binding.linux-arm64-gnu.node
          rolldown-binding.linux-x64-musl.node rolldown-binding.linux-arm64-musl.node
      - name: Rename and version the package
        id: version
        working-directory: packages/rolldown
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          # The release counter reads the versions already published.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../../.github/scripts/clickup-release-version.cjs
      - name: Publish
        working-directory: packages/rolldown
        # `prepublishOnly` runs `napi pre-publish`, which publishes upstream's per-platform
        # binding packages; this package carries its bindings in `dist` instead.
        run: pnpm publish --no-git-checks --ignore-scripts --tag "${{ steps.version.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the release's other dist-tags
        if: ${{ steps.version.outputs.extra_tags != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          EXTRA_TAGS: ${{ steps.version.outputs.extra_tags }}
        run: |
          for tag in $EXTRA_TAGS; do
            npm dist-tag add "@time-loop/rolldown@$VERSION" "$tag"
          done
      - name: Summary
        run: echo "Published \`@time-loop/rolldown@${{ steps.version.outputs.version }}\` (dist-tags \`${{ steps.version.outputs.tag }}\` ${{ steps.version.outputs.extra_tags }})" >> "$GITHUB_STEP_SUMMARY"
